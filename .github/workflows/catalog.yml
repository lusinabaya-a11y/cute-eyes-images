name: fetch-catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [catalog/**, .github/workflows/catalog.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 catalog/fetch.py
      - run: |
          git config user.name "cute-eyes-bot"
          git config user.email "bot@users.noreply.github.com"
          cp catalog.json /tmp/catalog.json
          git checkout --orphan catalog
          git rm -rf --cached . >/dev/null
          cp /tmp/catalog.json ./catalog.json
          git add catalog.json
          git commit -q -m "Cute Eyes catalog snapshot"
          git push -f origin catalog
