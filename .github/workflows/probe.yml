name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python3 audit/probe.py
      - run: |
          git config user.name "cute-eyes-bot"
          git config user.email "bot@users.noreply.github.com"
          cp probe.json /tmp/probe.json
          git checkout --orphan probe
          git rm -rf --cached . >/dev/null
          cp /tmp/probe.json ./probe.json
          git add probe.json
          git commit -q -m probe
          git push -f origin probe
